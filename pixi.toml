[workspace]
name = "mtl-roofs"
version = "0.0.0"
description = "LOD2 roof reconstruction for Montreal from open aerial LiDAR, evaluated against the city's own 3D building model"
channels = ["conda-forge"]
# This project is developed on macOS 12 Monterey (Intel). Without the macos floor
# the solver picks osx-64 builds that require macOS >= 13 and will not run here.
# CI is linux-64 and unaffected.
platforms = [{ name = "osx-64-monterey", platform = "osx-64", macos = "12.0" }, "linux-64"]

# ---------------------------------------------------------------- core runtime
[dependencies]
python = "3.12.*"
numpy = ">=1.26"
scipy = ">=1.11"
shapely = ">=2.0"
pyproj = ">=3.6"
geopandas = ">=1.0"
rasterio = ">=1.3"
gdal = ">=3.8"
pdal = ">=2.6"
python-pdal = ">=3.2"
laspy = ">=2.5"
lazrs-python = "*"
psycopg = ">=3.1"
sqlalchemy = ">=2.0"
geoalchemy2 = ">=0.14"
typer = ">=0.12"
pydantic = ">=2.6"
pydantic-settings = ">=2.2"
pyyaml = ">=6.0"
rich = ">=13.0"
open3d = ">=0.18"

[pypi-dependencies]
# NOTE: py3dtiles is deliberately absent. It is not on conda-forge, and on osx-64 a
# transitive source build fails against modern setuptools. The 3D Tiles writer is an
# open decision: see docs/adr/0002-3d-tiles-writer.md.
mtl-roofs = { path = ".", editable = true }

# ------------------------------------------------------------------------ dev
[feature.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"
pytest-cov = ">=5.0"
hypothesis = ">=6.100"
pre-commit = ">=3.7"
types-pyyaml = "*"

# ------------------------------------------------------------------- ml (v1)
[feature.ml.dependencies]
scikit-learn = ">=1.5"
lightgbm = ">=4.3"
pytorch = ">=2.2"

# -------------------------------------------------------------------- viewer
[feature.viewer.dependencies]
nodejs = ">=20"
pnpm = ">=9"

[environments]
default = { features = ["dev"], solve-group = "main" }
ml = { features = ["dev", "ml"], solve-group = "main" }
viewer = { features = ["viewer"] }

# ------------------------------------------------------------------ tasks
[tasks]
lint = "ruff check src tests"
format = "ruff format src tests && ruff check --fix src tests"
typecheck = "mypy --strict src"
test = "pytest tests/unit -v --cov=mtl_roofs --cov-report=term-missing --cov-report=xml"
test-integration = "pytest tests/integration -v -m integration"
eval-smoke = "python -m mtl_roofs.cli evaluate --smoke --fixtures tests/fixtures --out .eval-smoke"
db-up = "docker compose up -d --wait"
db-down = "docker compose down"

[feature.viewer.tasks]
viewer-dev = { cmd = "pnpm dev", cwd = "viewer" }
viewer-build = { cmd = "pnpm install --frozen-lockfile && pnpm build", cwd = "viewer" }
viewer-typecheck = { cmd = "pnpm typecheck", cwd = "viewer" }
