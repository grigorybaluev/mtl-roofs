[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtl-roofs"
version = "0.0.0"
description = "LOD2 roof reconstruction for Montreal from open aerial LiDAR, evaluated against the city's own 3D building model"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Grigory Baluev" }]
keywords = ["lidar", "lod2", "citygml", "point-cloud", "3d-reconstruction", "geospatial"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
mtl-roofs = "mtl_roofs.cli:app"

[project.urls]
Homepage = "https://github.com/grigorybaluev/mtl-roofs"
Issues = "https://github.com/grigorybaluev/mtl-roofs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mtl_roofs"]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "ANN", "D"]
ignore = ["D107", "D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdal.*", "laspy.*", "open3d.*", "py3dtiles.*", "geoalchemy2.*", "rasterio.*", "geopandas.*", "shapely.*", "pyproj.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs PostGIS or network (deselect with -m 'not integration')",
  "slow: takes more than a second",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/mtl_roofs"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
