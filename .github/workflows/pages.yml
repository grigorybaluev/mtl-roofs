# Deploys the viewer to GitHub Pages. Data products are built locally and attached
# to a release; CI never runs the full pipeline, so this job only bundles.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Attach the scene from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/data
          # The scene (`mtl-roofs export-scene`) is a release asset because data never
          # enters git. A release without one still deploys: the viewer says so.
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'viewer-data-*.zip' --dir /tmp 2>/dev/null; then
            unzip -q -o /tmp/viewer-data-*.zip -d dist/data
            test -s dist/data/scene.json && test -s dist/data/scene.bin
            echo "scene bundled"
          else
            echo "::warning::No viewer-data asset on the latest release; deploying the viewer without data."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v5
